name: Обновить Nike STEPPE
on:
  schedule:
    # 10:00 и 21:00 Москва, как локальный планировщик.
    - cron: '0 7,18 * * *'
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Проверить доступ и 3 карточки без публикации на сайт'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: steppe-nike-refresh
  cancel-in-progress: false
jobs:
  nike:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Собрать скидки Nike и проверить размеры
        env:
          SCRAPER_PERMISSIONS_JSON: ${{ vars.SCRAPER_PERMISSIONS_JSON || '{}' }}
          NIKE_DETAIL_LIMIT: ${{ inputs.verify_only && '3' || '10000' }}
        run: node scripts/scrape-nike.mjs
      - name: Подготовить подборку Nike по ценовым диапазонам
        if: ${{ !inputs.verify_only }}
        run: node node_modules/tsx/dist/cli.mjs scripts/build-catalog.ts artifacts/nike-report.json --out artifacts/publish-catalog
      - name: Опубликовать каталог в GitHub
        if: ${{ !inputs.verify_only }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-catalog.mjs artifacts/publish-catalog
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nike-report
          path: |
            artifacts/nike-report.json
            artifacts/nike-live/progress.json
            artifacts/nike-live/candidates.json
            artifacts/nike-live/result.json
          retention-days: 7
