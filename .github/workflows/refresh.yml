name: Обновить каталог STEPPE
on:
  schedule:
    # 10:00 и 21:00 Москва (UTC+3), одновременно с задачей Windows.
    - cron: '0 7,18 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'puma,reebok; пусто — оба магазина'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: steppe-catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/python-sale/requirements.txt
      - name: Установить зависимости предоставленных Python-парсеров
        run: python -m pip install -r scripts/python-sale/requirements.txt
      - name: Проверить Python-парсеры без обращения к магазинам
        run: python -m unittest discover -s scripts/python-sale -p 'test_*.py'
      - name: Установить браузер для разрешённых источников
        if: ${{ vars.SCRAPER_PERMISSIONS_JSON != '' && vars.SCRAPER_PERMISSIONS_JSON != '{}' }}
        run: npx playwright install --with-deps chromium
      - name: Проверить сайты и собрать разрешённые карточки
        env:
          SCRAPER_PERMISSIONS_JSON: ${{ vars.SCRAPER_PERMISSIONS_JSON || '{}' }}
          SCRAPER_SOURCE_IDS: ${{ inputs.sources || '' }}
          PYTHON_SALE_PARSERS: '1'
          SCRAPER_PROXY_URL: ${{ secrets.SCRAPER_PROXY_URL }}
        run: node scripts/scrape-sales.mjs
      - name: Передать результат на сайт
        env:
          STEPPE_SITE_URL: ${{ vars.STEPPE_SITE_URL || 'https://steppe-gray.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/upload-scrape-report.mjs
      - name: Сохранить отчёт проверки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-report
          path: |
            artifacts/scraper.json
            artifacts/diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Запросить обновление на Vercel
        if: always()
        env:
          SITE_URL: ${{ vars.STEPPE_SITE_URL || 'https://steppe-gray.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          node <<'NODE'
          (async () => {
            const secret = process.env.CRON_SECRET;
            if (!secret || secret.length < 32) throw new Error('Добавьте CRON_SECRET в GitHub Actions Secrets и Vercel.');
            const url = new URL('/api/cron/refresh', process.env.SITE_URL);
            if (url.protocol !== 'https:') throw new Error('SITE_URL должен использовать HTTPS.');
            const response = await fetch(url, {
              method: 'POST', redirect: 'error',
              headers: { Authorization: `Bearer ${secret}` },
              signal: AbortSignal.timeout(310000),
            });
            if (!response.ok) throw new Error(`Обновление вернуло HTTP ${response.status}. Проверьте Vercel и страницу источников.`);
            const data = await response.json();
            if (!Array.isArray(data.results)) throw new Error('Нет результатов проверки магазинов.');
            const failed = data.results.filter(r => r.status === 'error');
            const updated = data.results.filter(r => r.status === 'success').length;
            const waiting = data.results.filter(r => r.status === 'needs_configuration').length;
            const deferred = data.results.filter(r => r.status === 'deferred').length;
            console.log(`Обновлено магазинов: ${updated}; отложено до конца акции: ${deferred}; ожидают подключения фидов: ${waiting}.`);
            if (failed.length) throw new Error('Некоторые магазины не обновлены.');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
